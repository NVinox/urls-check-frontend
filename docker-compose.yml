version: "3.8"

services:
  dev:
    container_name: urls-check-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "${APPLICATION_PORT}:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    env_file:
      - .env.development
  prod:
    container_name: urls-check-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "${APPLICATION_PORT}:80"
    restart: always
    environment:
      - NODE_ENV=production
    env_file:
      - .env.production

networks:
  default:
    name: north-shop-network
    external: true
