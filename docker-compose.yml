version: "3.8"

services:
  dev:
    container_name: urls-check-dev
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "${APPLICATION_PORT}:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    env_file:
      - .env.development
    networks:
      - default
  prod:
    container_name: urls-check-prod
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    ports:
      - "${APPLICATION_PORT}:80"
    restart: always
    environment:
      - NODE_ENV=production
      - BACKEND_PORT=${BACKEND_PORT}
      - NGINX_ENVSUBST_FILTER=BACKEND_PORT
    env_file:
      - .env.production
    networks:
      - default
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  default:
    name: north-shop-network
    external: true
